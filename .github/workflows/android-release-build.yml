name: Android Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Capacitor CLI 8.x requires Node.js >= 22
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Capacitor Android 8.x uses sourceCompatibility = JavaVersion.VERSION_21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'

      - name: Install npm dependencies
        run: npm install

      - name: Create empty webDir placeholder
        run: mkdir -p out

      - name: Sync Capacitor native project
        run: npx cap sync android

      # Decode the base64-encoded keystore secret to a temp file.
      # GitHub Actions automatically masks secret values in logs.
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/sobre-upload-key.jks

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # bundleRelease reads signing config from build.gradle via KEYSTORE_* env vars.
      # Passwords are never written to disk or printed — only passed as env to Gradle.
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/sobre-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sobre-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Always delete the keystore from the runner workspace, even on build failure.
      - name: Remove keystore
        if: always()
        run: rm -f android/app/sobre-upload-key.jks
