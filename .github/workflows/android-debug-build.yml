name: Android Debug Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Capacitor CLI 8.x requires Node.js >= 22
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Capacitor Android 8.x uses sourceCompatibility = JavaVersion.VERSION_21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'

      - name: Install npm dependencies
        run: npm install

      - name: Create empty webDir placeholder
        run: mkdir -p out

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Shows where Gradle actually wrote the APK — useful if the upload path is wrong
      - name: Find APK output
        run: find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found in outputs"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sobre-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
