name: Android Debug Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # AGP 8.13.0 + Gradle 8.14.3 require JDK 17 minimum
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Caches ~/.gradle between runs; shaves ~1-2 min on repeat builds
          cache: 'gradle'

      # ubuntu-latest ships SDK up to android-35; compileSdkVersion=36 needs this.
      # sdkmanager is not in PATH — use full path under $ANDROID_HOME.
      - name: Install Android SDK Platform 36
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Install npm dependencies
        run: npm install

      # capacitor.settings.gradle and capacitor.build.gradle are .gitignored
      # (generated files). Without cap sync they don't exist and Gradle fails
      # on the very first `apply from:` line. Also generates capacitor.config.json
      # in android assets. The empty `out/` dir prevents a warning from cap sync
      # because webDir='out' is set in capacitor.config.ts (unused at runtime
      # since server.url is set, but cap sync still checks for the directory).
      - name: Create empty webDir placeholder
        run: mkdir -p out

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          # Gradle needs ANDROID_HOME; it's already set on ubuntu-latest
          # but being explicit avoids surprises
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sobre-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
